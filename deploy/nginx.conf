# Public web tier (provider-neutral). Serves the built single-page app and proxies /api/ to the API service.
# Header values are checked against deploy/headers.json by scripts/check_deploy_config.py. TLS is terminated either here or by the
# platform; the HSTS line is only meaningful over HTTPS (see deploy/README.md).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https://tile.openstreetmap.org; worker-src 'self' blob:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;   # enable only when served over HTTPS

  location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }

  # Hashed build assets are immutable; HTML and API answers must never be cached (withdrawn content must disappear).
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable" always; try_files $uri =404; }
  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Set-Cookie;              # the public API never sets cookies
    add_header Cache-Control "no-store" always;
  }
  location ~* \.map$ { return 404; }           # never serve source maps
  location / { add_header Cache-Control "no-store" always; try_files $uri /index.html; }
}
