name: Planning integrity
on: [push, pull_request]
permissions:
  contents: read
jobs:
  planning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify_planning.py --local
      - run: python scripts/verify_allocation.py --local
      - run: python scripts/check_public_contracts.py --fixtures
      - run: python scripts/check_governance.py
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: python scripts/check_capability_matrix.py
      - run: python scripts/check_architecture_review.py
