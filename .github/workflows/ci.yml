name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  node:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Start synthetic mock API
        run: |
          API_PORT=4010 pnpm --filter @makarba/api dev:mock &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4010/health && break; sleep 1; done
      - run: python scripts/check_public_contracts.py --fixtures --base-url http://127.0.0.1:4010
      - name: Public API conformance suite against the running mock (same suite is used for the real server)
        run: pnpm --filter @makarba/api conformance http://127.0.0.1:4010/api/v1/public
      - run: python scripts/check_secret_exposure.py
      - run: python scripts/check_no_street_imagery.py
      - name: CI policy (no non-blocking checks)
        run: python scripts/check_ci_policy.py
      - name: Dependency advisories (new or expired findings fail)
        run: python scripts/check_dependency_audit.py
      - name: Performance budgets (production build, fixture, mock API)
        run: python scripts/check_budgets.py --dist apps/web/dist --fixture docs/project/contracts/fixture-bundle.json --api http://127.0.0.1:4010
      - name: Mutation guard (tests must fail when a privacy/missingness rule is changed)
        run: python scripts/mutation_check.py
      - run: python scripts/scan_secrets.py
      - name: Rebuild with canary server secrets in the environment, capturing the output
        # Synthetic canary values (not real secrets). If any server secret could be inlined into the Vite bundle or printed by a build, the scans below find it.
        env:
          SESSION_SECRET: placeholder-canary-session-Zx9qL2vB7kT4mN8pR1wY5cD3hG6
          DATABASE_URL: postgres://canary_user:placeholderCanaryPwZx9qL2vB7kT4mN8@db.canary.invalid:5432/canary
          READONLY_DATABASE_URL: postgres://canary_ro:placeholderCanaryRoZx9qL2vB7kT4mN8@db.canary.invalid:5432/canary
          OIDC_CLIENT_SECRET: placeholder-canary-oidc-Zx9qL2vB7kT4mN8pR1wY5cD3
        run: pnpm --filter @makarba/web build > build-output.log 2>&1
      - name: Scan the browser bundle and the build output for the canary values
        env:
          SESSION_SECRET: placeholder-canary-session-Zx9qL2vB7kT4mN8pR1wY5cD3hG6
          DATABASE_URL: postgres://canary_user:placeholderCanaryPwZx9qL2vB7kT4mN8@db.canary.invalid:5432/canary
          READONLY_DATABASE_URL: postgres://canary_ro:placeholderCanaryRoZx9qL2vB7kT4mN8@db.canary.invalid:5432/canary
          OIDC_CLIENT_SECRET: placeholder-canary-oidc-Zx9qL2vB7kT4mN8pR1wY5cD3
        run: |
          python scripts/scan_secrets.py --bundle apps/web/dist --value-env SESSION_SECRET DATABASE_URL READONLY_DATABASE_URL OIDC_CLIENT_SECRET
          python scripts/scan_secrets.py --log build-output.log --value-env SESSION_SECRET DATABASE_URL READONLY_DATABASE_URL OIDC_CLIENT_SECRET
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm --filter @makarba/web exec playwright install --with-deps chromium
      - name: Real-browser public journeys against the production build (synthetic mock API, stubbed basemap tiles)
        run: pnpm --filter @makarba/web test:e2e
        env:
          E2E_TARGET: preview
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d --wait db
      - name: PostGIS available
        run: docker compose exec -T db psql -U makarba_dev -d makarba_dev -c "CREATE EXTENSION IF NOT EXISTS postgis; SELECT postgis_version();"
      - name: Apply least-privilege bootstrap (issue #36)
        run: docker compose exec -T db psql -U makarba_dev -d makarba_dev -v ON_ERROR_STOP=1 < db/bootstrap/001_roles_and_schemas.sql
      - name: Privilege and escalation tests
        run: docker compose exec -T db psql -U makarba_dev -d makarba_dev -v ON_ERROR_STOP=1 < db/tests/001_privileges.sql
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Migration, grant and session-store integration tests (issues #22, #32)
        run: pnpm --workspace-concurrency=1 --filter @makarba/db --filter @makarba/api --filter @makarba/auth --filter @makarba/authz --filter @makarba/audit test
        env:
          TEST_DATABASE_URL: postgres://makarba_dev:makarba_dev_password@127.0.0.1:5432/makarba_dev
      - name: Bootstrap is idempotent
        run: docker compose exec -T db psql -U makarba_dev -d makarba_dev -v ON_ERROR_STOP=1 < db/bootstrap/001_roles_and_schemas.sql
